version: 1.0.0

dependencies:
  lvgl/lvgl:
    version: ^9
    public: true

  espressif/esp_codec_dev:
    version: '*'
    public: true
    override_path: '../vendor/esp-adf/components/esp_codec_dev'
  joltwallet/littlefs: '*'
  espressif/button: '*'
  espressif/esp_jrnl: '*'
  # esp-adf-libs' CMakeLists REQUIRES nghttp (HTTP/2); the component manager
  # drops it unless it's an explicit manifest dependency.
  espressif/nghttp: '*'
