[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xmly"
version = "0.1.0"
description = "Ximalaya (喜马拉雅) API client"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-httpx>=0.30.0",
]

[project.scripts]
xmly = "xmly.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xmly"]
